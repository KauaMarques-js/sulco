    - paragraph: Cada nota representa a média de um ano completo. Uma anomalia maior produz uma nota mais aguda; uma menor, uma nota mais grave. O zero da referência 1951–1980 corresponde a 440 Hz. A mesma anomalia sempre produz a mesma frequência nos dois períodos.
