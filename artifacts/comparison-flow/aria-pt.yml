  - region "4. Compare os valores":
    - heading "4. Compare os valores" [level=2]
    - paragraph: A média de B (1,0129 °C) está 1,2263 °C acima da média de A (-0,2133 °C).
    - button "Ouvir resultado"
    - 'figure "Médias anuais na mesma escala A: 1880–1889 (━━) · B: 2016–2025 (┄┄)"':
      - strong: Médias anuais na mesma escala
      - text: "A: 1880–1889 (━━) · B: 2016–2025 (┄┄)"
      - 'img "Período A · 1880–1889: -0,2133 °C. Período B · 2016–2025: 1,0129 °C. A média de B (1,0129 °C) está 1,2263 °C acima da média de A (-0,2133 °C). O gráfico alinha o primeiro ano de A ao primeiro de B, e assim por diante. As duas linhas usam o mesmo eixo de anomalia."': 1,38 0 -0,46 1 10
    - paragraph: O gráfico alinha o primeiro ano de A ao primeiro de B, e assim por diante. As duas linhas usam o mesmo eixo de anomalia.
    - group: ＋ Consultar todos os anos e frequências
  - region "Como a comparação é calculada":
    - heading "Como a comparação é calculada" [level=2]
    - paragraph: "Cada valor anual é a média dos 12 valores mensais GISTEMP v4 publicados, em °C, em relação a 1951–1980. A média do período usa esses anos completos, com o mesmo peso para cada ano. A diferença é B menos A. Meses ausentes não são preenchidos. O som mantém o mapeamento da experiência: 440 × 2^(anomalia ÷ 4), sem normalizar cada período separadamente."
    - paragraph: As médias anuais e a comparação são calculadas pelo SULCO a partir da série mensal da NASA. A frequência sonora é uma representação artística dos dados.
    - link "Fonte dos dados · NASA GISS GISTEMP v4 ↗":
      - /url: https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv