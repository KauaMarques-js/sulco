  - region "4. Compare the values":
    - heading "4. Compare the values" [level=2]
    - paragraph: B's mean (1.0129 °C) is 1.2263 °C above A's mean (-0.2133 °C).
    - button "Read result aloud"
    - 'figure "Annual means on the same scale A: 1880–1889 (━━) · B: 2016–2025 (┄┄)"':
      - strong: Annual means on the same scale
      - text: "A: 1880–1889 (━━) · B: 2016–2025 (┄┄)"
      - 'img "Period A · 1880–1889: -0.2133 °C. Period B · 2016–2025: 1.0129 °C. B''s mean (1.0129 °C) is 1.2263 °C above A''s mean (-0.2133 °C). The chart aligns the first year of A with the first year of B, and so on. Both lines share the same anomaly axis."': 1.38 0 -0.46 1 10
    - paragraph: The chart aligns the first year of A with the first year of B, and so on. Both lines share the same anomaly axis.
    - group: ＋ Inspect all years and frequencies
  - region "How the comparison is calculated":
    - heading "How the comparison is calculated" [level=2]
    - paragraph: "Each annual value is the mean of the 12 published GISTEMP v4 monthly values, in °C relative to 1951–1980. The period mean uses these complete years, giving each year equal weight. The difference is B minus A. Missing months are not filled. Sound keeps the experience's mapping: 440 × 2^(anomaly ÷ 4), without normalizing each period separately."
    - paragraph: Annual means and the comparison are calculated by SULCO from NASA's monthly series. Sound frequency is an artistic representation of the data.
    - link "Data source · NASA GISS GISTEMP v4 ↗":
      - /url: https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv